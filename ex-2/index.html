<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Card Joker</title>
</head>
<body>
    <div class="triangulo sup-es"></div>
    <div class="triangulo sup-dir"></div>
    <div class="triangulo in-es"></div>
    <div class="triangulo in-dir"></div>
    <div class="container">
        <div class="inner-border">
        <h2 class="name">Joker</h2>
        <img class="photo" src="joker.jpg" alt="joker from persona 5">
        <p class="type">Tipo: Herói/protagosnista</p>
        <hr class="line">
        <ul>
            <h4 class="stats-bar">Barra de status</h4>
            <li class="stats">Vida: 150</li>
            <li class="stats">Poder: 70</li>
            <li class="stats">Inteligencia: 100</li>
            <li class="stats">Sorte: 200</li>
        </ul>
        </div>
    </div>
    
</body>
</html>
